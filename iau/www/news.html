{% extends "templates/Base.html" %}

{% block title %}
News
{% endblock %}

{% block content %}
<section class="news_listing" style="background-color: #FFFBF1;">
    <div class="container">
        <div class="divider" style="margin-top: 3.125rem; padding-bottom : 2.625rem;">
            <span id="news_listing_all_news_heading" class="text_span"
                style="text-transform: uppercase; font-size: 2.5rem; font-weight : bold; font-family: 'Encode Sans Condensed'; color : #3D4667;">All
                News</span>
        </div>
        <div class="select_container" style="width : 13.4375rem;padding: 0.625rem 0.3125rem;">
            <label for="sort" class="custom-label">Sort by:</label>
            <select id="sort" class="custom-select">
                <option value="most-recent">Most Recent</option>
                <option value="oldest">Oldest</option>
            </select>
        </div>
        <div id="news_listings_container"
            style="width: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.9375rem; padding: 1.875rem 0;">
            <!-- Dynamic Divs will be rendering here -->
        </div>
    </div>
</section>
<script>
    {% include "templates/includes/news_listings.js" %}
</script>
{% endblock %}
