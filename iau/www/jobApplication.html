{% extends "templates/Base.html" %}

{% block title %}
Job Application
{% endblock %}
{% block authentication %}
<script>
    const logged_user = '{{frappe.session.user}}';
    const currentHost = window.location.host;
    if(logged_user === "Guest"){
        window.location.href = `https://${currentHost}/Login?redirect-to=${encodeURIComponent(window.location.href)}`;
        }
</script>
{% endblock %}

{% block content %}
<section class="job_application" style="background-color: #EFE6D2;">
    <div class="container">
        <div style="display: flex; align-items: center; justify-content: space-between; padding : 2.5rem 0rem; border-bottom: 0.125rem solid transparent; /* Make the border transparent initially */
        border-image: linear-gradient(90deg, #93A1BB 0%, rgba(67, 73, 85, 0) 100%);
        border-image-slice: 1; flex-wrap : wrap;">
            <div>
                <h1 id="job_title"
                    style="text-transform: capitalize; font-size: 2rem; font-weight: 700; color: #3D4667; font-family: 'Encode Sans Condensed', system-ui">
                </h1>
                <div class="bulletin-container">
                    <div id="department" style="padding: 1.25rem 1.25rem 1.25rem 0; color: #8092A7; font-size: 1.375rem;
                        font-family: 'Encode Sans Condensed', system-ui; font-weight: 400;"></div>
                    <div class="disc-bulletin"></div>
                    <div id="employment_type" class="bulletin" style="padding: 1.25rem 1.25rem 1.25rem 0;"></div>
                    <div class="disc-bulletin"></div>
                    <div id="location" class="bulletin" style="padding: 1.25rem 1.25rem 1.25rem 0;"></div>
                </div>
            </div>
            <div>
                <div id="not-saved-indicator" style="background: #f2e6ce; padding : 0.625rem 8.75rem; font-family: 'Encode Sans Condensed', system-ui; font-size: 1.25rem;
                        font-weight: 700;line-height: 1.66375rem; letter-spacing: -0.03em; text-align: center; color : black;
                        display: none;">
                    Not Saved
                </div>
            </div>
        </div>
        <form style="padding-top: 2.5rem;" id="jobApplicationForm">
            <div style="display : flex; justify-content: space-between; flex-wrap : wrap">
                <div id="job_title_div" style="display : flex; flex-direction: column;">
                    <label for="job_title"
                        style="font-family: 'Encode Sans Condensed', system-ui; font-size: 1.25rem; line-height: 1.5rem; color : black; font-weight: 600">
                        Job Id *
                    </label>
                    <input type="text" class="form-control" id="job_title" readonly required
                        style="border: 0.0625rem solid #324362;font-family: 'Encode Sans Condensed', system-ui; margin-top: 0.875rem; font-size: 1.125rem; font-weight: 500; line-height: 1.664375rem; letter-spacing: -0.02em; text-align: left; color : black; padding : 0.625rem 1.5rem; background-color: #f2e6ce;">
                </div>
                <div id="applicant_name_div" style="display : flex; flex-direction: column;">
                    <label for="applicant_name"
                        style="font-family: 'Encode Sans Condensed', system-ui; font-size: 1.25rem; line-height: 1.5rem; color : black; font-weight: 600">
                        Applicant Name *
                    </label>
                    <input type="text" class="form-control" id="applicant_name" readonly required placeholder="johndoe@gmail.com"
                        style="border: 0.0625rem solid #324362;font-family: 'Encode Sans Condensed', system-ui; margin-top: 0.875rem; font-size: 1.125rem; font-weight: 500; line-height: 1.664375rem; letter-spacing: -0.02em; text-align: left; color : black; padding : 0.625rem 1.5rem; background-color: #f2e6ce;">
                </div>
            </div>
            <div style="display : flex; justify-content: space-between; margin-top: 1.5rem; flex-wrap : wrap;">
                <div style="display : flex; flex-direction: column;" id="applicant_email_div">
                    <label for="applicant_email"
                        style="font-family: 'Encode Sans Condensed', system-ui; font-size: 1.25rem; line-height: 1.5rem; color : black; font-weight: 600">
                        Email *
                    </label>
                    <input type="email" class="form-control" id="applicant_email" readonly required placeholder="johndoe@gmail.com"
                        style="border: 0.0625rem solid #324362;font-family: 'Encode Sans Condensed', system-ui; margin-top: 0.875rem; font-size: 1.125rem; font-weight: 500; line-height: 1.664375rem; letter-spacing: -0.02em; text-align: left; color : black; padding : 0.625rem 1.5rem; background-color: #f2e6ce;">
                </div>
                <div id="phone_country_div" style="display : flex; justify-content: space-between; flex-wrap : wrap">
                    <div id="country_div" style="display : flex; flex-direction: column;">
                        <label for="country_of_residence"
                            style="font-family: 'Encode Sans Condensed', system-ui; font-size: 1.25rem; line-height: 1.5rem; color : black; font-weight: 600">
                            Country of Residence *
                        </label>
                        <!-- <input type="text" class="form-control" id="country_of_residence" required placeholder="Saudi Arabia"
                            pattern="[A-Za-z\s]+"
                            style="border: 0.0625rem solid #324362;font-family: 'Encode Sans Condensed', system-ui; margin-top: 0.875rem; font-size: 1.125rem; font-weight: 500; line-height: 1.664375rem; letter-spacing: -0.02em; text-align: left; color : black; padding : 0.625rem 1.5rem;"> -->
                        <select name="country_of_residence" id="country_of_residence" class="form-control"
                        style="border: 0.0625rem solid #324362;font-family: 'Encode Sans Condensed', system-ui; margin-top: 0.875rem; font-size: 1.125rem; font-weight: 500; line-height: 1.664375rem; letter-spacing: -0.02em; text-align: left; color : black; padding : 0.625rem 1.5rem;">    
                        </select>
                    </div>
                    <div id="applicant_phone_number_div" style="display : flex; flex-direction: column;">
                        <label for="applicant_phone_number"
                            style="font-family: 'Encode Sans Condensed', system-ui; font-size: 1.25rem; line-height: 1.5rem; color : black; font-weight: 600">
                            Phone Number *
                        </label>
                        <div style="display: flex;flex-direction: row;">
                            <input type="text" class="form-control" id="country_isd_code" readonly required placeholder="+966"
                                style="width:7rem; border: 0.0625rem solid #324362;font-family: 'Encode Sans Condensed', system-ui; margin-top: 0.875rem; font-size: 1.125rem; font-weight: 500; line-height: 1.664375rem; letter-spacing: -0.02em; text-align: left; color : black; padding : 0.625rem 1.5rem; background-color: #f2e6ce;">
                            <input type="tel" class="form-control" id="applicant_phone_number" required
                                pattern="[0-9]*"
                                placeholder="9999922222"
                                title="Please fill in phone number(9865324756) without special character or alphabets"
                                style="width: 12.2rem; border: 0.0625rem solid #324362;font-family: 'Encode Sans Condensed', system-ui; margin-top: 0.875rem; font-size: 1.125rem; font-weight: 500; line-height: 1.664375rem; letter-spacing: -0.02em; text-align: left; color : black; padding : 0.625rem 1.5rem;">
                        </div>
                    </div>
                </div>
            </div>
            <div style="margin-top: 1.5rem;">
                <label for="cover_letter"
                    style="font-family: 'Encode Sans Condensed', system-ui; font-size: 1.25rem; line-height: 1.5rem; color: black; font-weight: 600;">
                    Cover Letter (Optional)
                </label>
                <textarea id="cover_letter" 
                    style="border: 0.0625rem solid #324362; font-family: 'Encode Sans Condensed', system-ui; margin-top: 0.875rem; font-size: 1.125rem; font-weight: 500; line-height: 1.664375rem; letter-spacing: -0.02em; text-align: left; color: black; padding: 0.625rem 0.875rem; width: 100%; box-sizing: border-box; min-height: 13.8125rem;"></textarea>
            </div>
            <input type="file" required id="fileInput" style="opacity: 0; position: absolute; z-index: -1;" accept=".pdf, .doc,.docx" />
            <button type="button" id="uploadButton"
                style="width: 100%; background: linear-gradient(180deg, #FFFBF1 0%, rgba(255, 251, 241, 0) 100%); font-family: 'Encode Sans Condensed', system-ui; margin-top: 1.375rem; font-size: 1.25rem; font-weight: 700; line-height: 2rem; letter-spacing: -0.02em; text-align: center; color : #101423; outline: none; box-shadow: none; border: 0.0625rem solid transparent !important; border-image: linear-gradient(180deg, #324362 -77.78%, rgba(50, 67, 98, 0) 129.63%) !important; border-image-slice: 1 !important;">
                Upload Resume *
            </button>
            <p id="fileNameDisplay" style="text-align: center; font-weight : 500; font-size : 1.25rem; margin-top : 0.625rem; font-family: 'Encode Sans Condensed', system-ui;">
                No file selected
            </p>
            <br>
            <div class="submit-button-container" style="display: flex; gap: 1.25rem; justify-content: flex-end; margin-top: 2.5rem;">
                <button type="button" id="discardButton"
                    style="background: linear-gradient(180deg, #FFFBF1 0%, rgba(255, 251, 241, 0) 100%); font-family: 'Encode Sans Condensed', system-ui; font-size: 1.25rem; font-weight: 700; line-height: 2rem; letter-spacing: -0.02em; text-align: center; color: #101423; outline: none; box-shadow: none; padding: 0.625rem 2.5rem; cursor : pointer; border: 0.0625rem solid transparent; border-image: linear-gradient(180deg, #324362 -77.78%, rgba(50, 67, 98, 0) 129.63%); border-image-slice: 1;"
                    onclick="window.history.back();">
                    Discard
                </button>
                <button type="submit" id="saveButton"
                    style="background-color: #101423; color: white; font-family: 'Encode Sans Condensed', system-ui; font-size: 1.25rem; font-weight: 700; line-height: 2rem; letter-spacing: -0.02em; padding: 0.625rem 2.5rem; outline: none; box-shadow: none; cursor: pointer; border: 0.0625rem solid transparent; border-image: linear-gradient(180deg, #324362 -77.78%, rgba(50, 67, 98, 0) 129.63%); border-image-slice: 1;">
                    Save
                </button>
            </div>
        </form>
    </div>
</section>
<div id="toastContainer" style="position: fixed; bottom: 1.25rem; right: 1.25rem; z-index: 9999; display: none;">
    <div id="toastMessage"
        style="background-color: #4CAF50; color: white; padding: 0.625rem 1.25rem; border-radius: 0.3125rem; font-size: 1.125rem;">
        Job application submitted successfully!
    </div>
</div>
<script>
    {% include "templates/includes/job_application.js" %}
</script>
{% endblock %}
